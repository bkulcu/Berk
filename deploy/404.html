<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı | İK Perspektif</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f7;
      color:#163044;font:16px/1.6 system-ui,-apple-system,sans-serif;text-align:center}
    .box{max-width:460px;padding:40px 28px}
    .code{font-size:64px;font-weight:750;color:#102b40;letter-spacing:-2px;margin:0}
    h1{font-size:22px;margin:8px 0 10px}
    p{color:#526674;margin:0 0 24px}
    a{display:inline-block;background:#176d64;color:#fff;text-decoration:none;
      padding:11px 20px;border-radius:9px;font-weight:650}
  </style>
</head>
<body>
  <main class="box">
    <p class="code">404</p>
    <h1>Bu sayfayı bulamadık</h1>
    <p>Aradığınız sayfa taşınmış veya hiç var olmamış olabilir.</p>
    <a href="/">Proje merkezlerine dön →</a>
  </main>
</body>
</html>
